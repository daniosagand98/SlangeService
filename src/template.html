var cache=null;window.JarvisSync=function(){if(cache&&Date.now()-cache.t<30000)return cache.p;var p=post({action:"sync"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});cache={t:Date.now(),p:p};return p;};
function done(){try{return JSON.parse(localStorage.getItem("jarvis.sync."+S)||"{}")}catch(e){return{}}}function mark(o){try{localStorage.setItem("jarvis.sync."+S,JSON.stringify(o))}catch(e){}}
window.JarvisSyncList=async function(list,opt){opt=opt||{};var id=opt.id||"id",st=opt.status||"status",fx=opt.fixed||"fixed";try{var s=await window.JarvisSync();if(!s)return{list:list,changed:false};var del=new Set(s.delete||[]),fix=new Set(s.fixed||[]),seenF=done(),ch=false;
var out=list.filter(function(r){if(del.has(String(r[id]))){ch=true;return false}return true}).map(function(r){var k=String(r[id]);if(fix.has(k)&&!seenF[k]){seenF[k]=1;if(r[st]!==fx){ch=true;var c=Object.assign({},r);c[st]=fx;return c}}return r});mark(seenF);return{list:out,changed:ch}}catch(e){return{list:list,changed:false}}};
